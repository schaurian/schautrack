# Schautrack Helm Chart Values

replicaCount: 1

image:
  repository: ghcr.io/schaurian/schautrack
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []

# Use an existing secret instead of creating one from values
# The secret must contain these keys:
#   - DATABASE_URL (required)
#   - SESSION_SECRET (required)
#   - POSTGRES_PASSWORD (required if postgresql.enabled)
#   - SMTP_USER (optional)
#   - SMTP_PASS (optional)
#   - AI_KEY (optional)
#   - AI_KEY_ENCRYPTION_SECRET (optional)
#   - OIDC_CLIENT_SECRET (optional)
existingSecret: ""
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount the ServiceAccount's API credentials into the pod.
  # The app does not talk to the Kubernetes API, so this is disabled by default.
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

podAnnotations: {}

# Pod-level security context for the web pod (applies to init + app containers).
# The app image runs as the non-root UID 1000 baked in at build time.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container-level security context for the web (and init) containers.
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts: []
    # - host: schautrack.local
    #   paths:
    #     - path: /
    #       pathType: Prefix
  tls: []
    # - secretName: schautrack-tls
    #   hosts:
    #     - schautrack.local

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Liveness probe for the app container — restarts it if the process stops
# responding. Rendered as-is via toYaml, so any valid Pod probe (httpGet,
# tcpSocket, exec) plus the usual timing fields (initialDelaySeconds,
# periodSeconds, timeoutSeconds, failureThreshold, successThreshold) may be
# substituted wholesale. These defaults match what the chart hardcoded before
# probes became overridable.
livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

# Readiness probe for the app container — pulls the pod out of the Service
# endpoints (without restarting it) while the check fails, e.g. the database
# is unreachable. Same override shape as livenessProbe above.
readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}

# Application configuration
config:
  # Port to listen on
  port: 3000
  # Step-up auth grace window — how long after primary login (or a fresh
  # step-up) sensitive auth-method changes are accepted without re-prompting.
  # Any time.ParseDuration value (e.g. "5s", "10m", "1h"). Empty = server
  # default of 30 min.
  stepUpTTL: ""
  # ⚠️  SECURITY WARNING: Change sessionSecret before production deployment!
  # Session secret (required) - generate with: openssl rand -base64 32
  # DO NOT commit real secrets to Git - use existingSecret instead
  sessionSecret: ""
  # Admin email - gets access to /admin page
  adminEmail: ""
  # Support email shown on support pages
  supportEmail: ""
  # Enable legal pages (/imprint, /privacy, /terms)
  enableLegal: false
  # Imprint page URL
  imprintUrl: "/imprint"
  # Imprint address (rendered as SVG, use \n for line breaks)
  imprintAddress: ""
  # Imprint email (rendered as SVG)
  imprintEmail: ""
  # Enable barcode scanning via OpenFoodFacts (default: true)
  enableBarcode: ""
  # Registration mode: "open" (default) or "false"/"invite" (requires invite code)
  # Also configurable via /admin settings page
  enableRegistration: ""
  # Release/update check. The app asks the release provider (GitHub by default)
  # for the newest published version so the footer can flag an outdated
  # instance. That is an outbound request to api.github.com on a 1-hour cache.
  # Every value here is OPTIONAL: leave it empty and the chart omits the
  # environment variable entirely, so the app's own default applies.
  updateCheck:
    # UPDATE_CHECK_ENABLED — set to false to opt out of the outbound request
    # entirely (recommended for privacy-sensitive or air-gapped installs; the
    # app default is enabled). This is a DISABLE-ONLY flag: the app tests
    # `!= "false"`, so false is the only value that changes behaviour, and it
    # must reach the ConfigMap as the string "false" — the template handles
    # that, so a plain YAML `false` here (or --set ...enabled=false) is correct.
    # "Report an Issue" links keep working either way; only the version lookup
    # is gated.
    enabled: ""
    # UPDATE_PROVIDER — "github" or "gitlab" (app default: github). Together
    # with repo/baseUrl this points the check at your own mirror instead of
    # disabling it. An unknown value makes the app log an error and fall back.
    provider: ""
    # UPDATE_REPO — "owner/repo" (GitLab also accepts nested
    # "group/subgroup/project"). App default: schaurian/schautrack.
    repo: ""
    # UPDATE_BASE_URL — host override for self-hosted GitHub Enterprise
    # (API assumed at <baseUrl>/api/v3) or self-hosted GitLab (<baseUrl>/api/v4).
    # Empty = the provider's public host.
    baseUrl: ""
  # CAPTCHA tuning. Note there is deliberately NO value for CAPTCHA_BYPASS:
  # it is a test-only escape hatch that makes VerifyCaptcha accept any
  # non-empty answer, removing all brute-force protection from login and
  # registration. It is set only by compose.test.yml and must stay unreachable
  # from the chart — please do not "fix" this by adding it.
  captcha:
    # LOGIN_CAPTCHA_GLOBAL_THRESHOLD — failed logins per account email or per
    # client IP (cross-session, 15-minute window) before login demands a
    # captcha (app default: 3). The per-session threshold is fixed at 3 and is
    # not affected. Raise this only where every client legitimately shares one
    # source IP — a test harness, or an egress NAT in front of many users —
    # since the shared-IP counter otherwise captcha-gates unrelated sessions.
    # A value of 0 or less is ignored by the app, so it means "use the default".
    globalThreshold: ""
  # Trust X-Forwarded-For headers for rate limiting (default: true)
  # Set to "false" for direct-access deployments without a reverse proxy
  trustProxy: ""
  # Rate limits. Every value here is OPTIONAL: leave it empty and the chart
  # omits the environment variable entirely, so the app's own compiled-in
  # default applies. Do not copy the defaults in — pinning them here freezes
  # your deployment at whatever the app shipped when you wrote the file.
  # A value of 0 is treated as unset by the app, so it also means "default".
  # Which client each bucket is keyed by depends on config.trustProxy.
  rateLimit:
    # RATE_LIMIT_AUTH — auth attempts per IP per 15 minutes on
    # login / register / step-up (app default: 10)
    auth: ""
    # RATE_LIMIT_STRICT — requests per IP per 5 minutes on sensitive endpoints:
    # password-reset request/confirm, 2FA reset, email-change request, and AI
    # estimate (app default: 5). This is the AI-estimate ceiling — raise it if
    # your users hit "too many requests" on photo estimation.
    strict: ""
    # RATE_LIMIT_API — requests per IP per minute on the public API /api/v1
    # (app default: 120). The outer guard, and the only limit that throttles
    # unauthenticated traffic. Keep well above the auth limiters: a client
    # syncing a day of entries makes dozens of calls in a burst.
    api: ""
    # RATE_LIMIT_API_TOKEN — requests per personal access token per minute on
    # /api/v1 (app default: 60). The limit a legitimate API client actually
    # runs into; per-IP alone means everyone behind one NAT shares a bucket.
    apiToken: ""
    # RATE_LIMIT_BARCODE — barcode lookups per minute, per IP on the app's own
    # route and per account on GET /api/v1/barcode/{code} (app default: 30).
    # One value covers both so the API cannot become the cheaper path to the
    # same third-party database.
    barcode: ""
  # Allow search engine indexing (sets ROBOTS_INDEX env var)
  robotsIndex: false
  # Base URL for SEO meta tags and the `servers` entry of the API's OpenAPI
  # document at /api/v1/openapi.json (leave empty to auto-detect from request;
  # the OpenAPI document then uses a relative URL, which clients resolve
  # against this instance either way)
  baseUrl: ""
  # Android App Links (Digital Asset Links) — binds the domain to the published
  # Android app so https:// links open in the app. Served at
  # /.well-known/assetlinks.json only when androidCertFingerprints is set.
  androidPackageName: "to.schauer.schautrack"
  # SHA-256 signing-cert fingerprint(s), comma-separated in UPPER:CO:LON form.
  # DEPLOYMENT-SPECIFIC — from Play Console → App signing (or keytool -list -v).
  # Empty = endpoint disabled. Never commit a placeholder/fake value.
  androidCertFingerprints: ""

# SMTP configuration (for password reset emails)
# ⚠️  SECURITY WARNING: SMTP credentials are sensitive! 
# Use existingSecret in production instead of storing passwords here
smtp:
  host: ""
  port: 587
  user: ""
  pass: ""  # DO NOT commit real passwords to Git
  from: ""
  secure: false

# AI configuration (optional)
# ⚠️  SECURITY WARNING: AI keys are sensitive and can incur costs!
# Use existingSecret in production - never commit API keys to Git
ai:
  # AI provider: openai, claude, or ollama
  provider: ""
  # API key for AI provider - DO NOT commit real keys to Git
  key: ""
  # Encryption secret for user API keys - generate with: openssl rand -hex 32
  # This must be kept secret and stable (changing it breaks existing user keys)
  keyEncryptionSecret: ""
  # Custom API endpoint (leave empty for defaults)
  endpoint: ""
  # Model override (e.g., gpt-4o, claude-sonnet-4-5-20250929, gemma3:12b)
  model: ""
  # Daily request limit per user when using global key (0 = unlimited)
  dailyLimit: 10

# PostgreSQL configuration
postgresql:
  # Enable bundled PostgreSQL (set to false to use external database)
  enabled: true
  image:
    repository: postgres
    tag: "18-alpine"
    pullPolicy: IfNotPresent
  # Pod-level security context for the postgres pod.
  # The postgres alpine image uses UID/GID 70; fsGroup makes the mounted PVC
  # group-writable so postgres can create/own its PGDATA subdirectory.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    seccompProfile:
      type: RuntimeDefault
  # Container-level security context for the postgres container.
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 70
    capabilities:
      drop:
        - ALL
  # Database credentials
  # ⚠️  SECURITY WARNING: Database passwords are critical secrets!
  # Use existingSecret in production - never commit passwords to Git
  auth:
    database: schautrack
    username: schautrack
    # Password (required) - generate with: openssl rand -hex 16
    # DO NOT use default passwords in production
    password: ""
  # Liveness probe for the postgres container. The default command is a
  # literal string baked in at chart-author time — it embeds the *default*
  # auth.database/auth.username above (schautrack/schautrack), not whatever
  # you set them to. If you override auth.database or auth.username, override
  # this probe's command too so pg_isready checks the right database/user.
  # Rendered as-is via toYaml, so any valid Pod probe form works here.
  livenessProbe:
    exec:
      command:
        - sh
        - -c
        - pg_isready -U schautrack -d schautrack
    initialDelaySeconds: 30
    periodSeconds: 10
  # Readiness probe for the postgres container. Same caveat as livenessProbe
  # above: the default command does not track auth.database/auth.username.
  readinessProbe:
    exec:
      command:
        - sh
        - -c
        - pg_isready -U schautrack -d schautrack
    initialDelaySeconds: 5
    periodSeconds: 5
  # Persistence configuration
  persistence:
    enabled: true
    # Use an existing PVC instead of creating one
    # If set, all other persistence options are ignored
    existingClaim: ""
    size: 5Gi
    # Storage class for dynamic provisioning
    # - "-" (default): disable dynamic provisioning (use pre-bound PV)
    # - "my-storage-class": use specific storage class
    storageClass: "-"
    accessMode: ReadWriteOnce
    # Annotations for the PVC (e.g., for backup tools like Velero)
    annotations: {}
    # Labels for the PVC
    labels: {}
  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 100m
    #   memory: 256Mi

# External database (used when postgresql.enabled is false)
externalDatabase:
  # Full connection string: postgres://user:pass@host:port/db
  url: ""

# OIDC / Single Sign-On (optional)
# ⚠️  SECURITY WARNING: clientSecret is sensitive! Use existingSecret in production.
# The redirect URI registered with your OIDC provider must be:
#   <config.baseUrl>/auth/oidc/callback
oidc:
  # OIDC issuer URL. Enables OIDC when set. Examples:
  #   https://accounts.google.com
  #   https://login.microsoftonline.com/<tenant>/v2.0
  #   https://auth.example.com/application/o/schautrack/
  issuer: ""
  # OAuth2 Client ID from your provider
  clientId: ""
  # OAuth2 Client Secret — DO NOT commit real secrets to Git; prefer existingSecret
  clientSecret: ""
  # Button label override (default: derived from issuer host, e.g. "Google")
  label: ""
  # Require invite code for OIDC sign-up (default: false — OIDC bypasses invite-only)
  requireInvite: false
  # Callback URL override (leave empty to auto-build from config.baseUrl)
  redirectUrl: ""

# Passkeys / WebAuthn (optional)
# Setting passkeys.rpId enables the feature. The RP ID gets baked into every
# registered passkey — once users have registered, changing it invalidates all
# existing passkeys. Use the public domain only (no scheme, no port, no path).
passkeys:
  # Relying Party ID. Examples: schautrack.com, staging.schautrack.com
  rpId: ""
  # Display name shown in browser/OS passkey prompts (default: Schautrack)
  rpName: ""
  # Allowed origins, comma-separated full URLs with scheme.
  # Defaults to https://<rpId>. Set this when the same rpId is served from
  # multiple URLs (e.g., www + apex, or an Android WebView origin).
  rpOrigins: ""
