apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "schautrack.fullname" . }}
  labels:
    {{- include "schautrack.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.config.port | quote }}
  {{- if .Values.config.adminEmail }}
  ADMIN_EMAIL: {{ .Values.config.adminEmail | quote }}
  {{- end }}
  {{- if .Values.config.supportEmail }}
  SUPPORT_EMAIL: {{ .Values.config.supportEmail | quote }}
  {{- end }}
  {{- if .Values.config.enableLegal }}
  ENABLE_LEGAL: {{ .Values.config.enableLegal | quote }}
  {{- end }}
  {{- if .Values.config.imprintUrl }}
  IMPRINT_URL: {{ .Values.config.imprintUrl | quote }}
  {{- end }}
  {{- if .Values.config.imprintAddress }}
  IMPRINT_ADDRESS: {{ .Values.config.imprintAddress | quote }}
  {{- end }}
  {{- if .Values.config.imprintEmail }}
  IMPRINT_EMAIL: {{ .Values.config.imprintEmail | quote }}
  {{- end }}
  {{- if .Values.smtp.host }}
  SMTP_HOST: {{ .Values.smtp.host | quote }}
  {{- end }}
  {{- if .Values.smtp.port }}
  SMTP_PORT: {{ .Values.smtp.port | quote }}
  {{- end }}
  {{- if .Values.smtp.from }}
  SMTP_FROM: {{ .Values.smtp.from | quote }}
  {{- end }}
  {{- if .Values.smtp.secure }}
  SMTP_SECURE: {{ .Values.smtp.secure | quote }}
  {{- end }}
  {{- if .Values.ai.provider }}
  AI_PROVIDER: {{ .Values.ai.provider | quote }}
  {{- end }}
  {{- if .Values.ai.endpoint }}
  AI_ENDPOINT: {{ .Values.ai.endpoint | quote }}
  {{- end }}
  {{- if .Values.ai.model }}
  AI_MODEL: {{ .Values.ai.model | quote }}
  {{- end }}
  {{- if .Values.ai.dailyLimit }}
  AI_DAILY_LIMIT: {{ .Values.ai.dailyLimit | quote }}
  {{- end }}
  {{- if .Values.config.enableBarcode }}
  ENABLE_BARCODE: {{ .Values.config.enableBarcode | quote }}
  {{- end }}
  {{- if .Values.config.enableRegistration }}
  ENABLE_REGISTRATION: {{ .Values.config.enableRegistration | quote }}
  {{- end }}
  {{- with .Values.config.updateCheck }}
  {{- /*
    UPDATE_CHECK_ENABLED is a disable-only flag: the app reads it as
    `os.Getenv("UPDATE_CHECK_ENABLED") != "false"`, so only the exact string
    "false" turns the check off and *any* other value (including "") leaves it
    on. A plain `{{- if .enabled }}` would therefore drop the one value that
    has to reach the ConfigMap. The `kindIs "bool"` arm emits whenever the
    value is a real boolean — true or false — while the bare `.enabled` arm
    covers strings from --set-string; an unset value is neither, so the key is
    omitted and the app default (on) applies.
  */}}
  {{- if or (kindIs "bool" .enabled) .enabled }}
  UPDATE_CHECK_ENABLED: {{ .enabled | quote }}
  {{- end }}
  {{- if .provider }}
  UPDATE_PROVIDER: {{ .provider | quote }}
  {{- end }}
  {{- if .repo }}
  UPDATE_REPO: {{ .repo | quote }}
  {{- end }}
  {{- if .baseUrl }}
  UPDATE_BASE_URL: {{ .baseUrl | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.config.trustProxy }}
  TRUST_PROXY: {{ .Values.config.trustProxy | quote }}
  {{- end }}
  {{- with .Values.config.rateLimit }}
  {{- if .auth }}
  RATE_LIMIT_AUTH: {{ .auth | quote }}
  {{- end }}
  {{- if .strict }}
  RATE_LIMIT_STRICT: {{ .strict | quote }}
  {{- end }}
  {{- if .api }}
  RATE_LIMIT_API: {{ .api | quote }}
  {{- end }}
  {{- if .apiToken }}
  RATE_LIMIT_API_TOKEN: {{ .apiToken | quote }}
  {{- end }}
  {{- if .barcode }}
  RATE_LIMIT_BARCODE: {{ .barcode | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.config.captcha }}
  {{- /*
    The app ignores a non-positive LOGIN_CAPTCHA_GLOBAL_THRESHOLD (it requires
    `n > 0`), so 0 correctly means "use the default" and truthiness is the
    right guard here — unlike UPDATE_CHECK_ENABLED above.
    CAPTCHA_BYPASS is deliberately absent; see values.yaml.
  */}}
  {{- if .globalThreshold }}
  LOGIN_CAPTCHA_GLOBAL_THRESHOLD: {{ .globalThreshold | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.config.robotsIndex }}
  ROBOTS_INDEX: {{ .Values.config.robotsIndex | quote }}
  {{- end }}
  {{- if .Values.config.baseUrl }}
  BASE_URL: {{ .Values.config.baseUrl | quote }}
  {{- end }}
  {{- if .Values.config.androidPackageName }}
  ANDROID_PACKAGE_NAME: {{ .Values.config.androidPackageName | quote }}
  {{- end }}
  {{- if .Values.config.androidCertFingerprints }}
  ANDROID_CERT_FINGERPRINTS: {{ .Values.config.androidCertFingerprints | quote }}
  {{- end }}
  {{- if .Values.config.stepUpTTL }}
  STEP_UP_TTL: {{ .Values.config.stepUpTTL | quote }}
  {{- end }}
  {{- if .Values.oidc.issuer }}
  OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  {{- end }}
  {{- if .Values.oidc.clientId }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  {{- end }}
  {{- if .Values.oidc.label }}
  OIDC_LABEL: {{ .Values.oidc.label | quote }}
  {{- end }}
  {{- if .Values.oidc.requireInvite }}
  OIDC_REQUIRE_INVITE: {{ .Values.oidc.requireInvite | quote }}
  {{- end }}
  {{- if .Values.oidc.redirectUrl }}
  OIDC_REDIRECT_URL: {{ .Values.oidc.redirectUrl | quote }}
  {{- end }}
  {{- if .Values.passkeys.rpId }}
  PASSKEYS_RP_ID: {{ .Values.passkeys.rpId | quote }}
  {{- end }}
  {{- if .Values.passkeys.rpName }}
  PASSKEYS_RP_NAME: {{ .Values.passkeys.rpName | quote }}
  {{- end }}
  {{- if .Values.passkeys.rpOrigins }}
  PASSKEYS_RP_ORIGINS: {{ .Values.passkeys.rpOrigins | quote }}
  {{- end }}
