apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "schautrack.fullname" . }}
  labels:
    {{- include "schautrack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "schautrack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "schautrack.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "schautrack.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # -rw, not the bare Cluster name: CNPG publishes no Service at the
          # Cluster's own name, so waiting on that would block forever.
          command: ['sh', '-c', 'until nc -z {{ include "schautrack.postgresql.rwService" . }} 5432; do echo waiting for postgres; sleep 2; done']
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret | default (include "schautrack.fullname" .) }}
            - configMapRef:
                name: {{ include "schautrack.fullname" . }}
          {{- if .Values.postgresql.enabled }}
          env:
            # Straight from the Secret CloudNativePG generates for the app user.
            #
            # `env` wins over `envFrom` on a name collision, which is what lets
            # this override the DATABASE_URL the chart Secret carries in
            # external-database mode without the two having to know about
            # each other.
            #
            # The `uri` key resolves to the cluster's -rw Service, and that is
            # load-bearing rather than incidental: NOTIFY does not replicate, so
            # a DSN pointing at -ro or -r would leave sse.Listen waiting on a
            # channel that never fires. Cross-instance SSE would go quiet with
            # no error anywhere — linked-user views would simply stop updating.
            # Never substitute a read Service here.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "schautrack.postgresql.appSecretName" . }}
                  key: uri
          {{- end }}
          livenessProbe:
            {{- include "schautrack.renderProbe" (dict "block" .Values.livenessProbe "indent" 12 "name" "livenessProbe") }}
          readinessProbe:
            {{- include "schautrack.renderProbe" (dict "block" .Values.readinessProbe "indent" 12 "name" "readinessProbe") }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
