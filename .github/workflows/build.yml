name: Build and Push

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'client/**'
      - 'db/init.sql'
      - 'helm/**'
      - 'public/**'
      - 'cliff.toml'
      - '.github/workflows/build.yml'
      # The E2E suite and everything that decides whether it can run at all.
      # Without these, a change to a spec, to the compose harness or to the
      # Playwright config gets no CI at all — which is precisely how the suite
      # rotted unnoticed in the first place.
      - 'e2e/**'
      - 'compose.test.yml'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      # The contract suite lives here; same reasoning as the e2e paths above.
      - 'scripts/**'
      - 'api/openapi.json'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'client/**'
      - 'db/init.sql'
      - 'helm/**'
      - 'public/**'
      - 'cliff.toml'
      - '.github/workflows/build.yml'
      - 'e2e/**'
      - 'compose.test.yml'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'api/openapi.json'

# One concurrency group per COMMIT, not per ref.
#
# GitHub keeps at most one *pending* run per concurrency group: "By default, any
# existing `pending` job or workflow in the same concurrency group will be
# canceled and the new queued job or workflow will take its place."
# `cancel-in-progress: false` only protects the run that is already executing —
# it does not queue the rest, which is what the previous version of this comment
# claimed. So `group: build-${{ github.ref }}` silently threw CI away for every
# merge in a burst except the first and the last: on 2026-08-08 four consecutive
# `staging` merge commits ran ZERO jobs, and the resulting tip of `staging` was
# never tested (issue #377). A test job that never runs protects nothing.
#
# Keying on the commit gives every pushed commit its own run, which can never be
# evicted. The serialisation the old group was reaching for now lives on the
# individual jobs that mutate shared state — see the `concurrency:` blocks on
# create-tag (git tags), publish-helm (gh-pages) and notify-argocd (the deploy
# nudge). test / compute-version / build-and-push / create-manifest are
# deliberately NOT serialised; each of those explains why at the job.
#
# Pull requests keep one group per PR and DO cancel in progress: a superseded PR
# run is wasted work whose result is about to be replaced anyway, and cancelling
# it frees the runner.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only GITHUB_TOKEN by default. Without this block every job inherits the
# repository default grant, which is far more than a test job needs. The jobs
# that actually write — create-tag / create-release / publish-helm /
# notify-argocd push to the repo, build-and-push / create-manifest push
# packages — each carry their own explicit `permissions:` block, which
# overrides this one; everything else only checks out code.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Without a database, every test guarded by `TEST_DATABASE_URL` skips — and
    # `go test` reports a skip as a pass. That silently disabled the tests most
    # worth running, above all
    # TestRunAllMigrationsIdempotentBodyProfileAndWeightGoals: migrations re-run
    # on every container start, so a non-idempotent migration's first symptom is
    # a pod that will not start, in production, on a RollingUpdate with
    # maxUnavailable: 0.
    #
    # The postgres major here must track the one the app actually runs against
    # (compose.test.yml / the Helm chart's postgres) — testing migrations on a
    # different major tests the wrong DDL semantics.
    #
    # TestIntegrationTestsRunInCI (internal/database/ci_guard_test.go) fails the
    # build if this block is ever removed while CI keeps reporting green.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Non-pushing jobs drop the workflow token from .git/config once the
          # checkout ends (zizmor: artipacked) — a compromised later step
          # should not find credentials lying on disk. The checkouts that DO
          # push (the release tag in create-tag, gh-pages in publish-helm, the
          # tag fetch in create-release) keep the default and say so inline.
          persist-credentials: false

      - name: Setup Go
        # zizmor flags every cache-enabled setup step in this workflow as a
        # cache-poisoning risk, because the `v*` tag trigger makes the whole
        # workflow count as a release publisher. These caches feed test gates
        # only: the published image is built by build-and-push from its own
        # fresh checkout and restores nothing cached here, so the ignore trades
        # a theoretical poisoned-test-cache for not rebuilding the Go and npm
        # worlds on every run.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0  # zizmor: ignore[cache-poisoning]
        with:
          go-version-file: go.mod

      # Ahead of the tests on purpose: both are fast, and a vet failure is
      # usually the honest explanation for a confusing test failure below.
      #
      # gofmt is enforced because "formatted by whatever the author's editor
      # did" produces diffs where a real change hides among reflowed lines —
      # exactly the reviewing cost this repo's commit style exists to avoid.
      # `gofmt -l` prints offending files and exits 0, so the file list has to
      # be turned into the failure itself.
      #
      # go vet catches the class this repo keeps hitting: a helper redeclared
      # in a package after two branches merge cleanly, a Printf verb that does
      # not match its argument, a lock copied by value. None of those are
      # compile errors, and none produce a conflict marker.
      - name: Check gofmt and go vet
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted. Run 'gofmt -w .' and commit:"
            echo "$unformatted" | while read -r f; do echo "::error file=$f::not gofmt-formatted"; done
            exit 1
          fi
          go vet ./...

      # -race is the point of this step, not a nicety. Almost everything this
      # app does concurrently is invisible to a serial test run: the SSE broker
      # fans out per-user channels while Postgres LISTEN/NOTIFY writes into the
      # same maps, the settings cache mutates shared state on a 1-minute TTL,
      # and the rate limiters and login-failure tracker are touched from every
      # request goroutine at once. A data race there is not a test failure, it
      # is a wrong number served to a user or a nil-map panic that takes the pod
      # down — and it reproduces roughly never on a developer laptop.
      #
      # -covermode=atomic rather than the default `set` because the race
      # detector requires it. The profile is uploaded below rather than gated on
      # a threshold: a number to look at during review, not a hurdle that makes
      # honest work fail.
      - name: Run Go tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

      - name: Summarize coverage
        if: always()
        run: |
          [ -f coverage.out ] || exit 0
          go tool cover -func=coverage.out > coverage.txt
          {
            echo "### Go coverage"
            echo
            echo '```'
            tail -n 1 coverage.txt
            echo '```'
            echo
            echo "<details><summary>Per-function coverage</summary>"
            echo
            echo '```'
            cat coverage.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.txt
          retention-days: 14
          if-no-files-found: ignore

      # Client type errors were previously caught only inside the Docker build
      # (client "build" is "tsc -b && vite build"), which runs after
      # compute-version and in parallel with create-tag — so a type regression
      # could still get a git tag pushed with no matching image. Gate on an
      # explicit client typecheck here in the test job, which every downstream
      # job (compute-version -> create-tag / build-and-push) already depends on.
      - name: Setup Node
        # Test-gate cache only — see the cache-poisoning note on Setup Go above.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7  # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Typecheck client
        run: npm run typecheck
        working-directory: client

      - name: Run client tests
        run: npm test
        working-directory: client

      # Two complementary guardrails: `i18n:drift` re-runs the extractor and
      # fails if the committed `en` catalogs are stale w.r.t. the source code;
      # `i18n:check` fails if any of the seven translated locales has fallen
      # behind `en`.
      - name: Check i18n extraction drift
        run: npm run i18n:drift
        working-directory: client

      - name: Check i18n catalog parity
        run: npm run i18n:check
        working-directory: client

  # A real gate from the first commit, not `continue-on-error` like `e2e`: the
  # tree is lint-clean as of this change, so there is no red-by-default period
  # to wait out. It is in `compute-version`'s `needs:` for the same reason
  # gofmt and go vet already are — those hard-gate the release chain today from
  # inside the `test` job, and a linter that can be ignored is one nobody fixes.
  #
  # Separate job rather than another step in `test` so it runs in parallel with
  # the tests (both take minutes, and a lint failure is usually the faster and
  # clearer of the two answers) and reports as its own check.
  lint:
    runs-on: ${{ github.ref == 'refs/heads/staging' && 'arc-runner' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The action manages its own analysis cache; setup-go's build cache
          # on top of it only adds restore time here.
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned rather than floating: a linter that silently gains checks on
          # its own release schedule turns an unrelated PR red for reasons its
          # author did not introduce. Renovate bumps this deliberately.
          version: v2.12.2

  # Deliberately NOT in the `needs` chain of compute-version / build-and-push.
  # govulncheck fails on vulnerabilities published upstream, which happens on
  # the Go team's schedule and not this repo's: wiring it into the release path
  # would mean a stdlib CVE announced at 03:00 blocks an unrelated hotfix from
  # shipping, with nothing this repo can do about it until a patch release
  # exists. As a standalone check it still shows a red X on the PR (and can be
  # made a required check in branch protection) without holding deploys hostage.
  #
  # `lint` above IS in that chain, deliberately differently: a lint failure is
  # in this repo's own code and fixable by the author who caused it.
  vuln:
    runs-on: ${{ github.ref == 'refs/heads/staging' && 'arc-runner' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        # Test-gate cache only — see the cache-poisoning note in `test`.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0  # zizmor: ignore[cache-poisoning]
        with:
          go-version-file: go.mod

      # GOTOOLCHAIN=local is load-bearing, not tidiness. For `go install
      # pkg@version` the toolchain is chosen from the *target* module's `go`
      # directive, not from this repo's: x/vuln declares `go 1.25.0`, so the
      # default `auto` announces "requires go >= 1.25.0; switching to go1.25.12"
      # and builds govulncheck with Go 1.25. That binary then cannot load this
      # module at all — every package fails with "requires newer Go version
      # go1.26" and the step exits non-zero having scanned nothing, which is the
      # worst failure mode available: a security gate that is red for a reason
      # unrelated to security. `local` pins both the build and govulncheck's own
      # `go list` subprocess to the toolchain setup-go installed from go.mod.
      #
      # govulncheck is call-graph aware: it reports only vulnerabilities that
      # are actually reachable from this code, so a finding here is a genuine
      # exposure rather than a transitive-dependency scare.
      - name: Check for known vulnerabilities
        env:
          GOTOOLCHAIN: local
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  contract:
    # Same runner reasoning as `e2e` below: this builds and runs the compose
    # stack, which the memory-limited single-slot arc-runner cannot host
    # without serialising the whole pipeline behind it.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        # Test-gate cache only — see the cache-poisoning note in `test`.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0  # zizmor: ignore[cache-poisoning]

      # No Go or Node step: the script talks to the stack over HTTP and seeds
      # its token with psql inside the db container. Everything it needs is
      # docker, curl and uv.
      - name: Run OpenAPI contract tests
        run: npm run test:contract

      - name: Upload contract report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: contract-report
          path: contract-report.xml
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    # NOTE: deliberately NOT the
    # `${{ github.ref == 'refs/heads/staging' && 'arc-runner' || 'ubuntu-latest' }}`
    # expression every other job here uses. The self-hosted `arc-runner` scale
    # set cannot run this suite:
    #   * its runner image ships no `sudo`, so `playwright install --with-deps`
    #     cannot install Chromium's system libraries — and Chromium will not
    #     launch without them;
    #   * it is `maxRunners: 1` with a 2Gi memory limit, so a Docker build plus
    #     PostgreSQL plus two Chromium workers risks an OOM kill *and* would
    #     serialise every other job in the pipeline behind the longest one.
    # This repository is public, so GitHub-hosted minutes are free. Revisit if
    # the runner image or its limits change.
    runs-on: ubuntu-latest
    needs: test
    # A hung browser must not sit on a runner for the default 6 hours.
    timeout-minutes: 45
    # REPORT-ONLY FOR NOW. This suite has never executed in CI, so its first
    # runs are expected to surface environment differences rather than real
    # regressions, and a gate that is red by default is a gate somebody deletes.
    #
    # TO TURN IT INTO A REAL GATE (target: once it has been green on `staging`
    # for a week — tracked in #312) TWO changes are needed, not one:
    #   1. delete the `continue-on-error` line below, and
    #   2. add `e2e` to `compute-version`'s `needs:` — otherwise the release
    #      chain still runs in parallel with this job and a red suite publishes
    #      an image anyway.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        # Test-gate cache only — see the cache-poisoning note in `test`.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7  # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24
          cache: npm
          # The root package.json is the Playwright harness; the `test` job
          # caches client/package-lock.json, which is a different dependency
          # tree and would restore the wrong cache here.
          cache-dependency-path: package-lock.json

      - name: Install E2E dependencies
        run: npm ci

      # No Python step: the seed used to mint bcrypt hashes by shelling out to
      # `python3 -c "import bcrypt; ..."`, which needed both python3 and the
      # bcrypt module installed here. #323 replaced that with bcryptjs, so
      # `npm ci` above is now the whole prerequisite. Nothing in e2e/ or
      # scripts/ shells to python3 any more — re-check before adding it back.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # These three steps are `npm run test:e2e` split apart on purpose.
      #
      # The original reason is gone: that script used to end in
      # `; docker compose ... down`, so a failing Playwright run still exited 0
      # (#320), and calling it here would have added a job that could never go
      # red. #320 is fixed — scripts/e2e.sh now exits with Playwright's status
      # and tears down through a trap — so this was revisited (#381).
      #
      # It stays split for a reason the script cannot serve: the job has to dump
      # the stack's container logs BETWEEN the Playwright run and the teardown.
      # `test:e2e` tears down internally, so a single step would take the
      # containers away before `Dump test stack logs` could read them, and a red
      # E2E run would arrive with no way to see why. Splitting also lets the
      # reporter be overridden for the artifact upload.
      #
      # Locally `npm run test:e2e` remains the one command to run; the split
      # exists only because CI wants a hook in the middle.
      #
      # Cost note: `test:e2e:setup` does a `docker compose up --build`, i.e. it
      # rebuilds the application image that `build-and-push` is building at the
      # same time. Reusing that image instead would be faster but is a larger
      # change (the compose file would need to take an image ref); the rebuild
      # is the simpler first step.
      - name: Start test stack and seed users
        run: npm run test:e2e:setup

      - name: Run Playwright suite
        # playwright.config.ts selects the `github` reporter under CI, which
        # emits inline annotations but writes no playwright-report/ — the
        # artifact upload below would find nothing. Ask for both.
        run: npx playwright test --reporter=github,html
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Dump test stack logs
        if: failure()
        run: docker compose -f compose.test.yml logs --no-color --tail=400

      - name: Tear down test stack
        if: always()
        run: npm run test:e2e:down

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          # test-results/ carries the traces and failure screenshots that
          # playwright.config.ts records (`trace: on-first-retry`,
          # `screenshot: only-on-failure`); the report links straight to them.
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  compute-version:
    runs-on: ubuntu-latest
    needs: [test, lint]
    # Deliberately not serialised: this job only *reads* git state. A group here
    # would be theatre — it is released the moment the job ends, several jobs
    # before create-tag writes anything. Job-level concurrency cannot span a
    # multi-job critical section, so the derivation is instead re-checked inside
    # create-tag's lock (#402); see scripts/next-version.sh.
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_tag: ${{ steps.version.outputs.should_tag }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # `$GITHUB_REF` (the default environment variable) rather than
      # `${{ github.ref }}` here and in every other run block: the values are
      # identical, but the expression form is spliced into the script text
      # before bash ever runs, which is zizmor's template-injection class.
      # Branch names cannot hurt this repo today, but the env form is the same
      # length and closes the class for good.
      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION##v}"  # Strip all leading v's
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "should_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # Shared with create-tag, which re-runs it under the tag lock to
            # verify nothing moved in between (#402).
            NEW_VERSION=$(sh scripts/next-version.sh)
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "should_tag=true" >> "$GITHUB_OUTPUT"

          elif [[ "$GITHUB_REF" == "refs/heads/staging" ]]; then
            VERSION="staging-${{ github.run_number }}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "should_tag=false" >> "$GITHUB_OUTPUT"

          else
            VERSION="${GITHUB_SHA::8}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "should_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine build platforms
        id: platforms
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/staging" ]]; then
            echo 'platforms=["linux/amd64"]' >> "$GITHUB_OUTPUT"
          else
            echo 'platforms=["linux/amd64","linux/arm64"]' >> "$GITHUB_OUTPUT"
          fi

  create-tag:
    runs-on: ubuntu-latest
    # Only push the git tag once the image artifact actually exists, so a build
    # failure (e.g. a client tsc error caught inside the Docker build) never
    # leaves a dangling version tag with no corresponding image or release.
    needs: [compute-version, create-manifest]
    if: needs.compute-version.outputs.should_tag == 'true'
    # The git tag namespace is repository-wide and the workflow-level group is
    # now per-commit, so two `main` runs can reach this job at the same time.
    # Serialise the tag writes repo-wide (not per-ref: tags are not scoped to a
    # branch).
    # The lock orders the writes; the "Re-derive the version" step below closes
    # the rest of #402 by re-checking the derivation inside it, so a run whose
    # version was overtaken fails with a diagnosis instead of pushing a tag that
    # disagrees with the images already published under it.
    concurrency:
      group: build-git-tags
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        # Keeps the default persist-credentials: the whole point of this job is
        # the `git push origin v<version>` two steps down, which authenticates
        # through the token this checkout writes into .git/config.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked]
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Re-derive the version under the tag lock
        # compute-version read `git describe` several jobs ago, outside this
        # concurrency group. If another `main` run tagged in the meantime, the
        # version this run has been building and labelling images with is now
        # the wrong one — it belongs to that other commit (#402).
        #
        # Re-running the SAME script here, inside the lock, is what makes the
        # check meaningful: it compares against the tag namespace as it stands
        # at the moment of writing.
        #
        # A mismatch fails the release rather than tagging anyway. Tagging the
        # stale version would point v<x> at this commit while the images
        # published under it came from the other run, which is the confusing
        # half-state a "loud failure" exists to avoid. Re-running the workflow
        # on this commit derives the now-correct version and republishes
        # cleanly.
        run: |
          ACTUAL=$(sh scripts/next-version.sh)
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Version raced: this run built and published images as v$EXPECTED, but the next version is now v$ACTUAL — another main run tagged while this one was building. Re-run this workflow on this commit to republish under v$ACTUAL."
            exit 1
          fi
          echo "v$EXPECTED is still the next version"
        env:
          EXPECTED: ${{ needs.compute-version.outputs.version }}

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}

  build-and-push:
    runs-on: ubuntu-latest
    needs: compute-version
    # Deliberately not serialised. Two reasons:
    #   1. This is a matrix job, and one job-level concurrency group is shared by
    #      every matrix leg unless `matrix.platform` is part of the key — so a
    #      naive group here would queue linux/arm64 behind linux/amd64 and, since
    #      only one job may be pending per group, cancel one of them outright.
    #   2. It needs no lock anyway: the image is pushed by digest
    #      (push-by-digest=true, i.e. content-addressed), so overlapping pushes
    #      are idempotent, and the human-readable tag is applied later by
    #      create-manifest from this run's own digest artifacts.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform: ${{ fromJson(needs.compute-version.outputs.platforms) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.compute-version.outputs.version }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ needs.compute-version.outputs.version }}
          # Build on every event (validates the image compiles, incl. client tsc),
          # but only push to the registry for push events — never from PR context.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Disable SLSA provenance / SBOM attestations. They are pushed as
          # extra manifest entries that show up as "unknown/unknown" platforms
          # on the GHCR package page (one per built arch), cluttering it.
          provenance: false
          sbom: false

      - name: Export digest
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  create-manifest:
    runs-on: ubuntu-latest
    needs: [compute-version, build-and-push]
    # Only assemble/push the multi-arch manifest for push events — PR builds
    # do not push images, so there are no digests to reference.
    if: github.event_name == 'push'
    # Deliberately not serialised: on staging the tag it writes is unique per run
    # (staging-<run_number>), and the digests it consumes are this run's own
    # upload-artifact output, so concurrent runs have nothing to contend over.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `${REGISTRY}` / `${IMAGE_NAME}` are the workflow-level `env:` values,
      # which the runner exports as real environment variables — no need to
      # splice them in as `${{ env.* }}` expressions (zizmor:
      # template-injection, same class as the `$GITHUB_REF` note in
      # compute-version).
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # Build docker buildx imagetools create command with all digests
          TAGS=()
          TAGS+=("${REGISTRY}/${IMAGE_NAME}:${VERSION}")

          # Add 'latest' tag only for main branch non-staging releases
          if [[ "$GITHUB_REF" == "refs/heads/main" ]] && [[ ! "$VERSION" =~ ^staging- ]]; then
            TAGS+=("${REGISTRY}/${IMAGE_NAME}:latest")
          fi

          # Build list of image references from digests
          IMAGES=()
          for digest in *; do
            IMAGES+=("${REGISTRY}/${IMAGE_NAME}@sha256:${digest}")
          done

          # Create manifest with all tags
          for tag in "${TAGS[@]}"; do
            # The unquoted $(printf ...) is deliberate: it must word-split
            # into `--tag <ref>`, and image refs never contain whitespace.
            # shellcheck disable=SC2046
            docker buildx imagetools create \
              $(printf -- '--tag %s ' "$tag") \
              "${IMAGES[@]}"
          done
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}"
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}

  create-release:
    runs-on: ubuntu-latest
    # Runs after create-tag so the release always references a tag that was
    # pushed only after the image artifact exists (create-tag needs the
    # manifest, so this transitively runs after create-manifest too).
    needs: [compute-version, create-tag]
    if: needs.compute-version.outputs.should_tag == 'true'
    # Deliberately NOT put in the build-git-tags group: it is already ordered
    # behind create-tag by `needs`, and sharing that group would let a later
    # run's create-tag cancel this run's pending create-release, leaving a
    # pushed tag with no GitHub release attached.
    permissions:
      contents: write
    steps:
      - name: Checkout
        # Keeps the default persist-credentials: `git fetch --tags --force`
        # below talks to origin through the credentials this checkout persists.
        # An anonymous fetch would probably work on a public repo, but the
        # release chain is not the place to find out when it does not.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: git-cliff

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="v${APP_VERSION}"

          # Find the previous tag (the one before our new tag)
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${VERSION}$" | head -1)

          # Generate grouped changelog with git-cliff for the range
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git-cliff --config cliff.toml --latest --strip header 2>/dev/null || echo "")
          else
            CHANGES=$(git-cliff --config cliff.toml "${PREV_TAG}..${VERSION}" --strip header 2>/dev/null || echo "")
          fi

          # Fallback to flat commit list if git-cliff produced no output
          if [ -z "$CHANGES" ]; then
            if [ -n "$PREV_TAG" ]; then
              CHANGES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
            else
              CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges)
            fi
          fi

          cat <<EOF > changelog.md
          ## Docker Images

          \`\`\`bash
          docker pull ghcr.io/${{ github.repository }}:${APP_VERSION}
          # or
          docker pull ghcr.io/${{ github.repository }}:latest
          \`\`\`

          **Architectures:** \`linux/amd64\`, \`linux/arm64\`

          ---

          ${CHANGES}

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${VERSION}
          EOF
        env:
          APP_VERSION: ${{ needs.compute-version.outputs.version }}

      - name: Create Release
        # zizmor suggests replacing this with a `gh release create` script step
        # (superfluous-actions). Swapping a proven step in the release chain
        # for zero security gain is exactly the trade this repo does not make.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2  # zizmor: ignore[superfluous-actions]
        with:
          tag_name: v${{ needs.compute-version.outputs.version }}
          name: Release v${{ needs.compute-version.outputs.version }}
          body_path: changelog.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-helm:
    runs-on: ubuntu-latest
    needs: [compute-version, create-manifest]
    # Never package/publish the chart from PR context: for PRs compute-version
    # emits an 8-char SHA that is not valid semver (helm package would reject it),
    # and gh-pages must only be written by push events on main/staging.
    if: github.event_name == 'push'
    # gh-pages is a single branch mutated by a plain `git push` with no rebase or
    # retry, so two concurrent publishes mean one push is rejected
    # non-fast-forward and that chart is lost. The group is repository-wide, not
    # per-ref, because `main` and `staging` write different directories of the
    # SAME branch — a collision the old per-ref workflow-level group never
    # covered.
    # Left on the default `queue: single`, so at most one publish is pending and
    # a merge burst collapses to the newest chart. That is deliberate: the steps
    # below `rm -f *.tgz` and re-index (last writer wins) while ArgoCD resolves
    # `>=0.0.1` to the highest version, so publishing every chart in a burst
    # would risk leaving the highest index entry pointing at a deleted file —
    # GitHub does not guarantee queue ordering. Fix issue #405 before switching
    # this to `queue: max`.
    concurrency:
      group: build-gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # This checkout only feeds `helm package`; the push happens from the
      # separate gh-pages checkout below, which keeps its own credentials.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Determine channel
        id: channel
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "path=." >> "$GITHUB_OUTPUT"
          else
            echo "channel=staging" >> "$GITHUB_OUTPUT"
            echo "path=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Update chart versions
        run: |
          # Update appVersion to match container version
          sed -i "s/^appVersion: .*/appVersion: \"${APP_VERSION}\"/" helm/schautrack/Chart.yaml

          # Calculate chart version
          if [[ "$GITHUB_REF" == "refs/heads/staging" ]]; then
            # For staging: use 0.0.N format (e.g., 0.0.84)
            # This avoids prerelease format which helm search hides by default
            CHART_VERSION="0.0.${{ github.run_number }}"
            sed -i "s/^version: .*/version: ${CHART_VERSION}/" helm/schautrack/Chart.yaml
          else
            sed -i "s/^version: .*/version: ${APP_VERSION}/" helm/schautrack/Chart.yaml
          fi

          echo "Updated Chart.yaml:"
          cat helm/schautrack/Chart.yaml
        env:
          APP_VERSION: ${{ needs.compute-version.outputs.version }}

      - name: Package Helm chart
        run: |
          mkdir -p .helm-packages
          helm package helm/schautrack -d .helm-packages

      - name: Checkout gh-pages
        # Keeps the default persist-credentials: the `Push to gh-pages` step
        # pushes (and rebase-retries) through this checkout's token.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked]
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update Helm repo
        run: |
          CHANNEL_PATH="gh-pages/${CHANNEL_DIR}"
          mkdir -p "$CHANNEL_PATH"

          # Ensure .nojekyll exists to prevent Jekyll processing
          touch gh-pages/.nojekyll

          # Remove stale .tgz files to prevent cross-channel contamination
          # (helm repo index scans all .tgz in the directory and adds them to the index)
          rm -f "$CHANNEL_PATH"/*.tgz

          # Copy only the new package
          cp .helm-packages/*.tgz "$CHANNEL_PATH/"

          # Update or create index (--merge preserves previous valid entries)
          if [ -f "$CHANNEL_PATH/index.yaml" ]; then
            helm repo index "$CHANNEL_PATH" --url "https://helm.schautrack.com/${CHANNEL_DIR}" --merge "$CHANNEL_PATH/index.yaml"
          else
            helm repo index "$CHANNEL_PATH" --url "https://helm.schautrack.com/${CHANNEL_DIR}"
          fi
        env:
          CHANNEL_DIR: ${{ steps.channel.outputs.path }}

      - name: Push to gh-pages
        run: |
          cd gh-pages
          git add .
          git commit -m "Update Helm chart (${CHANNEL}) - appVersion ${APP_VERSION}" || exit 0

          # Rebase and retry (#405). gh-pages is ONE branch shared by both
          # channels: main writes / and staging writes /staging/. Two
          # publish-helm jobs therefore start from the same gh-pages commit and
          # the second plain `git push` is rejected non-fast-forward — losing
          # that chart entirely, with the job red for a reason that has nothing
          # to do with the chart it built.
          #
          # The two channels touch disjoint directories, so a rebase resolves
          # cleanly; there is no content conflict to reason about, only a race
          # on the branch tip. Retrying with a fresh fetch each time is the
          # whole fix.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed the chart on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing onto the current gh-pages tip"
            git fetch origin gh-pages
            # --rebase keeps our single commit on top; a conflict here would
            # mean both channels wrote the same file, which the directory split
            # makes impossible, so failing loudly is right.
            git rebase origin/gh-pages || {
              echo "::error::gh-pages rebase hit a conflict — both channels wrote the same path"
              exit 1
            }
            sleep $((attempt * 3))
          done
          echo "::error::could not push the Helm chart after 5 attempts"
          exit 1
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          APP_VERSION: ${{ needs.compute-version.outputs.version }}

  notify-argocd:
    runs-on: ${{ github.ref == 'refs/heads/staging' && 'arc-runner' || 'ubuntu-latest' }}
    needs: [compute-version, publish-helm]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    # One deploy nudge per ref is enough. This job waits up to 15 minutes for
    # GitHub Pages and then refreshes a single ArgoCD application; in a merge
    # burst only the newest chart is worth deploying, and serialising per ref
    # also stops several 15-minute waits from parking on the single self-hosted
    # runner (issue #406). Dropping a superseded nudge is safe: every step here
    # is already best-effort and ArgoCD polls the Helm repo every ~3 minutes.
    concurrency:
      group: build-argocd-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # push an empty gh-pages commit when a Pages deployment fails
    steps:
      - name: Determine ArgoCD application
        id: app
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "name=schautrack-prod" >> "$GITHUB_OUTPUT"
          else
            echo "name=schautrack-staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Helm chart on GitHub Pages
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/staging" ]]; then
            VERSION="0.0.${{ github.run_number }}"
            URL="https://helm.schautrack.com/staging/index.yaml"
          else
            VERSION="$RELEASE_VERSION"
            URL="https://helm.schautrack.com/index.yaml"
          fi
          # GitHub Pages rebuilds the custom-domain CDN asynchronously after the
          # gh-pages push, and *queues* deployments when several pushes land
          # close together, so propagation can take well over the old 450s.
          # Wait generously, but DO NOT fail the release if it is slow: the
          # image and Helm chart are already published, and ArgoCD polls the
          # Helm repo on its own interval (~3m), so the deploy still happens.
          # This step is only a best-effort accelerator for the refresh below.
          MAX_ATTEMPTS=180   # 180 * 5s = 15m
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if curl -sf "$URL?_=$(date +%s)" | grep -q "version: $VERSION"; then
              echo "Chart version $VERSION is live on GitHub Pages"
              exit 0
            fi
            # A Pages deployment can fail outright with "Deployment failed,
            # try again later." (three times on 2026-07-03) and GitHub never
            # retries it on its own. Deployments are cached per gh-pages
            # commit SHA, so re-requesting a build of the SAME commit
            # (POST /pages/builds) fails instantly with the cached result —
            # verified 2026-07-03. Only a NEW commit gets a fresh deployment,
            # so push an empty one, once, 5 minutes in.
            if [[ $i -eq 60 ]]; then
              echo "Chart still not visible — pushing an empty gh-pages commit to force a fresh Pages deployment"
              {
                git clone --quiet --depth 1 --branch gh-pages \
                  "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
                  "$RUNNER_TEMP/ghpages-kick" &&
                git -C "$RUNNER_TEMP/ghpages-kick" \
                  -c user.name="github-actions[bot]" \
                  -c user.email="github-actions[bot]@users.noreply.github.com" \
                  commit --allow-empty -m "chore: retrigger failed Pages deployment" &&
                git -C "$RUNNER_TEMP/ghpages-kick" push --quiet origin HEAD:gh-pages
              } || echo "gh-pages kick failed (non-fatal); continuing to wait"
            fi
            echo "Waiting for GitHub Pages to serve $VERSION... ($i/$MAX_ATTEMPTS)"
            sleep 5
          done
          echo "::warning::Chart $VERSION not visible on GitHub Pages after $((MAX_ATTEMPTS * 5))s; not failing the release — ArgoCD will pick it up on its next poll."
          exit 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.compute-version.outputs.version }}

      # Best-effort: nudge ArgoCD to sync immediately instead of waiting for its
      # poll. A transient ArgoCD hiccup must not red an already-published release.
      - name: Refresh ArgoCD application (best-effort)
        continue-on-error: true
        run: |
          curl -sSf -X GET \
            "${ARGOCD_SERVER}/api/v1/applications/${APP_NAME}?refresh=normal" \
            -H "Authorization: Bearer ${ARGOCD_AUTH_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /dev/null -w "ArgoCD refresh: HTTP %{http_code}\n"
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          APP_NAME: ${{ steps.app.outputs.name }}
